<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather API - Pencari Lokasi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 20%, #4f63d8, #2a3bb5 55%, #1c2a8c);
  }

  .card {
    width: 100%;
    max-width: 440px;
    padding: 28px 26px;
    border-radius: 18px;
    background: #f4f4fb;
    color: #1e293b;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
    animation: muncul .6s ease;
  }
  @keyframes muncul {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .judul {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #334155;
    padding-bottom: 14px;
    border-bottom: 2px solid #334155;
  }

  .identitas {
    text-align: center;
    margin: 16px 0 20px;
    line-height: 1.6;
    color: #334155;
  }

  .form { display: flex; gap: 10px; }

  input {
    flex: 1;
    padding: 11px 14px;
    font-size: 15px;
    border: 2px solid #334155;
    border-radius: 10px;
    background: #fff;
    outline: none;
    transition: box-shadow .2s;
  }
  input:focus { box-shadow: 0 0 0 3px rgba(79, 99, 216, .35); }

  button {
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: #3a3a3f;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s, background .2s;
  }
  button:hover { background: #1e293b; transform: translateY(-2px); }

  .hasil {
    margin-top: 18px;
    padding: 4px 18px;
    border: 1px solid #dbe0ea;
    border-radius: 14px;
    background: #fafafe;
    animation: muncul .5s ease;
  }
  .baris {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #e2e8f0;
  }
  .baris:last-child { border-bottom: 0; }
  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #3b5bdb;
  }
  .nilai { text-align: right; font-weight: 500; }

  .pesan { margin-top: 18px; text-align: center; color: #64748b; }
  .error { color: #dc2626; font-weight: 600; }

  .peta {
    display: block;
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    color: #3b5bdb;
    text-decoration: none;
  }
  .peta:hover { text-decoration: underline; }

  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="judul">Weather API</div>

    <div class="identitas">
      Faraby Muzakki Malau<br>
      C
    </div>

    <div class="form">
      <input type="text" id="inputLokasi" placeholder="Masukkan lokasi, cth: Bandung">
      <button id="btnCari">Search</button>
    </div>

    <p id="pesan" class="pesan">Ketik nama lokasi lalu tekan Search.</p>

    <div id="hasil" class="hasil hidden"></div>
    <a id="linkPeta" class="peta hidden" target="_blank" rel="noopener">📍 Lihat di peta</a>
  </div>

<script>
  const input   = document.getElementById("inputLokasi");
  const pesan   = document.getElementById("pesan");
  const hasil   = document.getElementById("hasil");
  const linkPeta = document.getElementById("linkPeta");

  function baris(label, nilai) {
    return `<div class="baris">
              <span class="label">${label}</span>
              <span class="nilai">${nilai}</span>
            </div>`;
  }

  async function cariLokasi() {
    const kota = input.value.trim();

    if (!kota) {
      pesan.textContent = "Lokasi belum dimasukkan.";
      pesan.className = "pesan error";
      return;
    }

    pesan.textContent = "⏳ Mencari data...";
    pesan.className = "pesan";
    hasil.classList.add("hidden");
    linkPeta.classList.add("hidden");

    try {
      const res  = await fetch(`/api/lokasi?kota=${encodeURIComponent(kota)}`);
      const data = await res.json();

      if (!res.ok) throw new Error(data.message);

      // Field dari app.js: kota, negara, provinsi, kecamatan, longitude, latitude
      hasil.innerHTML =
        baris("Lokasi", data.kota) +
        baris("Negara", data.negara) +
        baris("Provinsi", data.provinsi) +
        baris("Kecamatan", data.kecamatan) +
        baris("Longitude", data.longitude) +
        baris("Latitude", data.latitude);

      linkPeta.href = `https://www.openstreetmap.org/?mlat=${data.latitude}&mlon=${data.longitude}#map=12/${data.latitude}/${data.longitude}`;

      pesan.className = "pesan hidden";
      hasil.classList.remove("hidden");
      linkPeta.classList.remove("hidden");
    } catch (err) {
      pesan.textContent = "❌ " + err.message;
      pesan.className = "pesan error";
    }
  }

  document.getElementById("btnCari").addEventListener("click", cariLokasi);
  input.addEventListener("keydown", e => { if (e.key === "Enter") cariLokasi(); });
</script>
</body>
</html>
